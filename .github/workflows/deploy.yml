name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rollout at 6:00 AM IST (= 00:30 UTC; IST is UTC+5:30), so each day's
  # lesson is published without anyone lifting a finger. GitHub cron is always in UTC.
  # The build already ships lessons a couple of days ahead and the app itself unlocks each one at
  # 6:00 AM IST for everyone, so a delayed or skipped run (GitHub can lag by several minutes)
  # never makes a lesson late.
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch: # "Run workflow" button, for emergencies

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Build
        run: npm run build
        env:
          # Project sites live at /<repo>/. For a user site or custom domain, set the repository
          # variables BASE_PATH ("/") and SITE_URL (your domain) under Settings → Variables.
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          # Optional anonymous visit counter (GoatCounter site code). Leave the variable unset to disable.
          VITE_GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Each morning, once the new lesson is live, open an issue holding the ready-to-paste WhatsApp text.
  # GitHub emails it to the repository owner (and to the GitHub mobile app); the issue is then closed
  # again so the list stays tidy. Only on the daily schedule or a manual run, never on ordinary pushes.
  notify:
    needs: deploy
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write today's post
        run: npx tsx scripts/post-issue.ts
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      - name: Email it to the owner via a GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f post.md ]; then
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" \
              --title "$(cat post-title.txt)" --body-file post.md)
            gh issue close "$url" --repo "$GITHUB_REPOSITORY" --reason completed
          else
            echo "No lesson to post today."
          fi
